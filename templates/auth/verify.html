{% extends "base.html" %}

{% block title %}Email Verification - PrepMate{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 3rem auto; text-align: center;">
  <div class="card" style="padding: 3rem 2rem;">
    <div style="font-size: 3.5rem; margin-bottom: 1rem;">✉️</div>
    <h2 style="font-size: 1.85rem; font-weight: 800; color: var(--dark); margin-bottom: 0.5rem;">Email Verified!</h2>
    <p style="color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem;">
      Your student email has been successfully verified. You can now proceed to your personalized student dashboard and interview coaching.
    </p>
    <a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-primary btn-lg" style="width: 100%;">
      Go to Dashboard ➔
    </a>
  </div>
</div>
{% endblock %}
