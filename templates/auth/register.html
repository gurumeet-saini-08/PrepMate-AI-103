{% extends "base.html" %}

{% block title %}Create Account - PrepMate{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 1.5rem auto 2.5rem; width: 100%;">
  <div class="card">
    <div style="text-align: center; margin-bottom: 1.75rem;">
      <h2 style="font-size: 1.85rem; font-weight: 800; color: var(--dark);">Create Your Account</h2>
      <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.3rem;">Join PrepMate to accelerate your interview performance</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}">
      <div class="form-group">
        <label class="form-label" for="name">Full Name</label>
        <input type="text" id="name" name="name" class="form-control" required placeholder="Enter your full name">
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Student / Personal Email</label>
        <input type="email" id="email" name="email" class="form-control" required placeholder="Enter your email address">
        <span class="form-text">Use your student or official email address.</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Create Password</label>
        <input type="password" id="password" name="password" class="form-control" required placeholder="Create a password (min. 6 characters)">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
        Register & Setup Profile
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
      Already registered? <a href="{{ url_for('auth.login') }}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign in here</a>
    </div>
  </div>
</div>
{% endblock %}
